array_layout = "Block"
array_width = 80
# chain_indent = "Block"
chain_split_single_child = true
closure_block_indent_threshold = 1
comment_width = 80
condense_wildcard_suffixes = true
control_brace_style = "AlwaysSameLine"
fn_args_density = "Tall"
fn_args_layout = "Visual"
fn_args_paren_newline = false
fn_brace_style = "PreferSameLine"
fn_call_style = "Block"
fn_call_width = 80
fn_return_indent = "WithWhereClause"
generics_indent = "Visual"
item_brace_style = "PreferSameLine"
match_block_trailing_comma = true
max_width = 80
reorder_imported_names = true
reorder_imports = true
reorder_imports_in_group = true
single_line_if_else_max_width = 80
space_after_bound_colon = true
space_after_struct_lit_field_colon = true
space_after_type_annotation_colon = true
space_before_bound = false
space_before_struct_lit_field_colon = false
space_before_type_annotation = false
spaces_around_ranges = true
struct_lit_multiline_style = "PreferSingle"
struct_lit_style = "Block"
struct_lit_width = 80
struct_variant_width = 80
tab_spaces = 4
trailing_comma = "Vertical"
type_punctuation_density = "Wide"

# Local Variables:
# coding: utf-8
# End:
